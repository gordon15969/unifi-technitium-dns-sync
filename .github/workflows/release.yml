name: Release

# A pushed version tag publishes a release; scripts/release.sh --tag pushes one.
# "Run workflow" on the Actions tab is a dry run: it builds and verifies the
# package and checks the publishing token, but creates nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must match VERSION
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' unifi_technitium_sync.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in unifi_technitium_sync.py"
            exit 1
          fi
      - name: Test and build the package
        run: scripts/release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/
          retention-days: 7

  # Only this job can write to the repository, and it runs no repository code:
  # it downloads the package built above, verifies its checksum and publishes it.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist
      - name: Publish the release
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Dry run from $GITHUB_REF_NAME: would publish $(cd dist && ls *.tar.gz)"
            gh release list --limit 1
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --latest
